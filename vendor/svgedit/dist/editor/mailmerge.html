<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/logo.svg">
  <style id="styleoverrides" media="screen"></style>
  <link href="./svgedit.css" rel="stylesheet" media="all">
  <script type="module" src="./browser-not-supported.js"></script>
  <title>Edit SVG template</title>
</head>
<body style="margin:0">
  <div id="container" style="width:100%;height:100vh"></div>
  <script type="module">
    import Editor from "./Editor.js";

    const svgEditor = new Editor(document.getElementById("container"));
    // Skip ext-storage so a previous local drawing cannot replace the template.
    // Skip ext-opensave so the in-editor save button cannot download a copy
    // that has not had Inkscape labels restored. The parent page saves.
    svgEditor.setConfig({
      canvasName: "mailmerge",
      noStorageOnLoad: true,
      no_save_warning: true,
      noDefaultExtensions: true,
      dynamicOutput: true,
      extensions: [
        "ext-connector",
        "ext-eyedropper",
        "ext-grid",
        "ext-markers",
        "ext-panning",
        "ext-shapes",
        "ext-polystar",
        "ext-layer_view"
      ],
      userExtensions: []
    });

    function tellParent(type, extra) {
      if (!window.parent || window.parent === window) return;
      window.parent.postMessage(Object.assign({ source: "mailmerge-svgedit", type: type }, extra || {}), "*");
    }

    try {
      svgEditor.init();
      svgEditor.ready(() => tellParent("ready"));
    } catch (err) {
      tellParent("error", { message: err && err.message ? err.message : String(err) });
    }
  </script>
</body>
</html>
